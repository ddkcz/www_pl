<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0F1823"/><stop offset="1" stop-color="#0A1118"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2A3A4D" opacity=".45"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF7A5C"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4A7FB5"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)" opacity=".55"/><g transform="translate(72 54)"><path d="M0 8l16-9 16 9v19l-16 9L0 27zM0 8l16 10 16-10M16 18v18" fill="none" stroke="#FF7A5C" stroke-width="4" stroke-linejoin="round"/><text x="48" y="29" font-family="IBM Plex Sans, Arial, sans-serif" font-size="30" font-weight="500" fill="#E8F0F9">CADsmart</text></g><text x="1528" y="86" font-family="IBM Plex Mono, Consolas, monospace" font-size="19" fill="#FF7A5C" text-anchor="end">BEYOND THE CAD SCREEN · 3/3</text><text x="72" y="160" font-family="IBM Plex Sans, Arial, sans-serif" font-size="52" font-weight="500" fill="#E8F0F9" text-anchor="start"><tspan x="72" dy="0">A test should reduce risk, not merely confirm function</tspan></text><path d="M72 282H1528" stroke="#2A3A4D" stroke-width="2"/><g transform="translate(120 420)"><rect width="210" height="110" rx="22" fill="#18283A" stroke="#4A7FB5" stroke-width="2"/><text x="105" y="65" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" fill="#E8F0F9" text-anchor="middle">REQUIREMENT</text></g><path d="M340 475H390" stroke="#FF7A5C" stroke-width="4" marker-end="url(#arr)"/><g transform="translate(410 420)"><rect width="210" height="110" rx="22" fill="#18283A" stroke="#FF7A5C" stroke-width="2"/><text x="105" y="65" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" fill="#E8F0F9" text-anchor="middle">RISK</text></g><path d="M630 475H680" stroke="#FF7A5C" stroke-width="4" marker-end="url(#arr)"/><g transform="translate(700 420)"><rect width="210" height="110" rx="22" fill="#18283A" stroke="#FFAA50" stroke-width="2"/><text x="105" y="65" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" fill="#E8F0F9" text-anchor="middle">TEST METHOD</text></g><path d="M920 475H970" stroke="#FF7A5C" stroke-width="4" marker-end="url(#arr)"/><g transform="translate(990 420)"><rect width="210" height="110" rx="22" fill="#18283A" stroke="#FFAA50" stroke-width="2"/><text x="105" y="65" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" fill="#E8F0F9" text-anchor="middle">CRITERION</text></g><path d="M1210 475H1260" stroke="#FF7A5C" stroke-width="4" marker-end="url(#arr)"/><g transform="translate(1280 420)"><rect width="210" height="110" rx="22" fill="#18283A" stroke="#4A7FB5" stroke-width="2"/><text x="105" y="65" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" fill="#E8F0F9" text-anchor="middle">DECISION</text></g><g transform="translate(210 625)"><rect width="1180" height="130" rx="24" fill="#211A18" stroke="#E5624A"/><text x="42" y="48" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" fill="#FF7A5C">WEAK EVIDENCE</text><text x="42" y="92" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" fill="#E8F0F9">“The prototype works” without a defined risk and criterion does not support a clear decision.</text></g><text x="800" y="838" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" fill="#B8C7D6" text-anchor="middle">Every test should end with a decision: accept, improve, or return to concept.</text></svg>