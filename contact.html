<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CADsmart - Kontakt</title>
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="CADsmart">
  <meta property="og:url"         content="https://cadsmart.pl/contact.html">
  <meta property="og:title"       content="CADsmart - Kontakt">
  <meta property="og:description" content="Skontaktuj się ze mną.">
  <meta property="og:image"       content="https://cadsmart.pl/assets/og-image.png">
  <meta property="og:image:width"  content="744">
  <meta property="og:image:height" content="198">
  <meta name="twitter:card"       content="summary_large_image">
  <link rel="alternate" hreflang="pl" href="https://cadsmart.pl/contact.html">
  <link rel="alternate" hreflang="en" href="https://cadsmart.pl/en/contact.html">




  <script>
    (function(){
      var t = localStorage.getItem('theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="container">

    <header class="page-header">
      <span class="section-label">ARKUSZ 05 / 05 · KONTAKT</span>
      <h1>Skontaktuj się</h1>
      <p>Chcesz nawiązać współpracę, masz pytanie albo po prostu chcesz porozmawiać? Napisz!</p>
    </header>

    <section class="contact-grid">

      <div class="contact-methods">
        <a href="mailto:dawid@cadsmart.pl" class="contact-method">
          <div class="contact-icon">@</div>
          <div>
            <div class="contact-method-label">E-mail</div>
            <div class="contact-method-value">dawid@cadsmart.pl</div>
          </div>
        </a>

        <a href="https://www.linkedin.com/in/dkuczynski/" class="contact-method">
          <div class="contact-icon">in</div>
          <div>
            <div class="contact-method-label">LinkedIn</div>
            <div class="contact-method-value">/in/dkuczynski</div>
          </div>
        </a>

        <a href="https://github.com/ddkcz" class="contact-method">
          <div class="contact-icon">&lt;/&gt;</div>
          <div>
            <div class="contact-method-label">GitHub</div>
            <div class="contact-method-value">@ddkcz</div>
          </div>
        </a>

        <a href="https://drive.google.com/file/d/1kf4cg47bCfFmtxZYEU9217pzfHDYTTLn/view?usp=sharing" class="contact-method">
          <div class="contact-icon">PDF</div>
          <div>
            <div class="contact-method-label">CV</div>
            <div class="contact-method-value">Pobierz (PDF)</div>
          </div>
        </a>
      </div>

     <form id="contact-form" action="https://formspree.io/f/xyegeegd" method="POST">
      <label for="name">Imię</label>
      <input type="text" id="name" name="name" required placeholder="Twoje imię">

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required placeholder="twoj@email.pl">

      <label for="message">Wiadomość</label>
      <textarea id="message" name="message" required placeholder="Opowiedz mi o swoim projekcie lub pytaniu..."></textarea>

      <input type="hidden" name="_subject" value="Nowa wiadomość z CADsmart.pl">
      <input type="text" name="_gotcha" style="display:none">

      <button type="submit" class="btn btn-primary">Wyślij wiadomość →</button>
      <p class="form-privacy-link"><a href="privacy.html">Polityka prywatności i klauzula RODO →</a></p>
    </form>
    </section>
    

  </main>
  <div id="footer-placeholder"></div>

  <script src="js/script.js"></script>
</body>
</html>
